spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cosre?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-users.enabled=${BOOTSTRAP_USERS_ENABLED:false}
# Seed data hoc vu demo (Subject SE101 + Syllabus + Classroom + Lecturer/Student).
# Mac dinh TAT tren MySQL vi day thuong la DB dung chung/staging - chi bat 1 lan khi
# can seed cho moi truong demo, tranh tao du lieu "rac" moi lan ai do khoi dong app.
# Bat bang: -DBOOTSTRAP_USERS_ENABLED=true -DBOOTSTRAP_DEMO_ACADEMIC_ENABLED=true
app.bootstrap-demo-academic.enabled=${BOOTSTRAP_DEMO_ACADEMIC_ENABLED:false}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
