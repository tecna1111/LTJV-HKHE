spring.datasource.url=jdbc:h2:mem:cosre;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@cosre.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}

app.bootstrap-users.enabled=${BOOTSTRAP_USERS_ENABLED:true}
app.bootstrap-users.head-dept.username=${BOOTSTRAP_HEAD_DEPT_USERNAME:headdept}
app.bootstrap-users.head-dept.email=${BOOTSTRAP_HEAD_DEPT_EMAIL:headdept@cosre.local}
app.bootstrap-users.head-dept.password=${BOOTSTRAP_HEAD_DEPT_PASSWORD:HeadDept@123}
app.bootstrap-users.staff.username=${BOOTSTRAP_STAFF_USERNAME:staff}
app.bootstrap-users.staff.email=${BOOTSTRAP_STAFF_EMAIL:staff@cosre.local}
app.bootstrap-users.staff.password=${BOOTSTRAP_STAFF_PASSWORD:Staff@123}
