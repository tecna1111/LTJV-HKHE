spring.datasource.url=jdbc:h2:mem:cosre;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@cosre.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}

app.bootstrap-users.enabled=${BOOTSTRAP_USERS_ENABLED:true}
app.bootstrap-users.head-dept.username=${BOOTSTRAP_HEAD_DEPT_USERNAME:headdept}
app.bootstrap-users.head-dept.email=${BOOTSTRAP_HEAD_DEPT_EMAIL:headdept@cosre.local}
app.bootstrap-users.head-dept.password=${BOOTSTRAP_HEAD_DEPT_PASSWORD:HeadDept@123}
app.bootstrap-users.staff.username=${BOOTSTRAP_STAFF_USERNAME:staff}
app.bootstrap-users.staff.email=${BOOTSTRAP_STAFF_EMAIL:staff@cosre.local}
app.bootstrap-users.staff.password=${BOOTSTRAP_STAFF_PASSWORD:Staff@123}
app.bootstrap-users.lecturer.username=${BOOTSTRAP_LECTURER_USERNAME:lecturer}
app.bootstrap-users.lecturer.email=${BOOTSTRAP_LECTURER_EMAIL:lecturer@cosre.local}
app.bootstrap-users.lecturer.password=${BOOTSTRAP_LECTURER_PASSWORD:Lecturer@123}
app.bootstrap-users.student1.username=${BOOTSTRAP_STUDENT1_USERNAME:student1}
app.bootstrap-users.student1.email=${BOOTSTRAP_STUDENT1_EMAIL:student1@cosre.local}
app.bootstrap-users.student1.password=${BOOTSTRAP_STUDENT1_PASSWORD:Student@123}
app.bootstrap-users.student2.username=${BOOTSTRAP_STUDENT2_USERNAME:student2}
app.bootstrap-users.student2.email=${BOOTSTRAP_STUDENT2_EMAIL:student2@cosre.local}
app.bootstrap-users.student2.password=${BOOTSTRAP_STUDENT2_PASSWORD:Student@123}

# Bật sẵn demo Subject/Syllabus/Classroom cho môi trường dev (H2, mất dữ liệu mỗi lần restart nên seed lại không sao).
app.bootstrap-demo-academic.enabled=${BOOTSTRAP_DEMO_ACADEMIC_ENABLED:true}
