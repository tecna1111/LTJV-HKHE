services:
  mysql:
    image: mysql:8.0
    container_name: cosre-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-cosre}
      MYSQL_USER: ${DB_USERNAME:-cosre_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CosreApp@123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cosre_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosre_mysql_data:
